<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoruba Live Translator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #1a6b3c;
      --gold: #d4a017;
      --cream: #fdf6ec;
      --dark: #111;
      --card: #ffffff;
      --muted: #7a7060;
      --border: #e8dcc8;
      --red: #c0392b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(212,160,23,0.08) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(26,107,60,0.08) 0%, transparent 50%);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header .flag {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 5vw, 30px);
      color: var(--dark);
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 300;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 22px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    /* ── Input Section ── */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--dark);
      resize: none;
      outline: none;
      background: var(--cream);
      transition: border-color 0.2s;
      min-height: 90px;
    }

    textarea:focus { border-color: var(--green); }
    textarea::placeholder { color: #bbb; }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #micBtn {
      flex: 1;
      padding: 13px;
      background: var(--dark);
      color: #fff;
    }

    #micBtn:hover { background: #333; }
    #micBtn.listening {
      background: var(--red);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(192,57,43,0); }
    }

    #translateBtn {
      flex: 1;
      padding: 13px;
      background: var(--green);
      color: #fff;
    }

    #translateBtn:hover { background: #145230; }
    #translateBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Output Box ── */
    .output-box {
      background: var(--cream);
      border-radius: 12px;
      padding: 15px;
      border: 1.5px solid var(--border);
      min-height: 70px;
      position: relative;
    }

    .box-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .box-content {
      font-size: 16px;
      color: var(--dark);
      line-height: 1.6;
      word-break: break-word;
    }

    .box-content.placeholder { color: #bbb; font-style: italic; font-size: 14px; }

    .box-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      justify-content: flex-end;
    }

    .icon-btn {
      padding: 6px 12px;
      font-size: 13px;
      background: #fff;
      border: 1.5px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
    }

    .icon-btn:hover { border-color: var(--green); color: var(--green); }

    /* ── Status ── */
    #status {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
      min-height: 18px;
    }

    #status.active { color: var(--green); }
    #status.error { color: var(--red); }

    /* ── History ── */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .history-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      color: var(--dark);
    }

    #clearHistory {
      font-size: 12px;
      padding: 5px 10px;
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--muted);
      border-radius: 7px;
    }

    #clearHistory:hover { border-color: var(--red); color: var(--red); }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .history-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      background: var(--cream);
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .history-item .yo { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .history-item .en { font-size: 14px; color: var(--dark); font-weight: 500; }
    .history-item .ts { font-size: 11px; color: #bbb; margin-top: 5px; }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #ccc;
      font-size: 13px;
    }

    /* ── Spinner ── */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .spinner { display: inline-block; }
    .loading .btn-text { display: none; }

    /* ── Gold accent line ── */
    .accent-bar {
      height: 3px;
      background: linear-gradient(90deg, var(--green), var(--gold));
      border-radius: 2px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>

  <header>
    <div class="flag">🇳🇬</div>
    <h1>Yorùbá Translator</h1>
    <p>Speak or type Yorùbá · Get instant English translation</p>
  </header>

  <!-- Input Card -->
  <div class="card">
    <div class="accent-bar"></div>
    <div class="input-section">
      <textarea id="yorubaInput" placeholder="Tẹ ọrọ Yorùbá rẹ nihin… (Type Yoruba here)"></textarea>
      <div class="btn-row">
        <button id="micBtn">
          <span>🎤</span>
          <span class="btn-text">Start Mic</span>
          <div class="spinner"></div>
        </button>
        <button id="translateBtn">
          <span>⚡</span>
          <span class="btn-text">Translate</span>
          <div class="spinner"></div>
        </button>
      </div>
    </div>
    <div id="status">Ready</div>
  </div>

  <!-- Output Card -->
  <div class="card">
    <div class="output-box">
      <div class="box-label">🇳🇬 Yorùbá — Heard / Input</div>
      <div class="box-content placeholder" id="yorubaDisplay">Waiting for input...</div>
    </div>

    <div style="height:12px"></div>

    <div class="output-box">
      <div class="box-label">🇬🇧 English — Translation</div>
      <div class="box-content placeholder" id="englishDisplay">Translation will appear here...</div>
      <div class="box-actions">
        <button class="icon-btn" id="speakBtn" title="Speak translation">🔊 Listen</button>
        <button class="icon-btn" id="copyBtn" title="Copy translation">📋 Copy</button>
      </div>
    </div>
  </div>

  <!-- History Card -->
  <div class="card">
    <div class="history-header">
      <h3>Translation History</h3>
      <button id="clearHistory">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-state">No translations yet</div>
    </div>
  </div>

  <script>
    // ── Elements ──
    const micBtn = document.getElementById("micBtn");
    const translateBtn = document.getElementById("translateBtn");
    const yorubaInput = document.getElementById("yorubaInput");
    const yorubaDisplay = document.getElementById("yorubaDisplay");
    const englishDisplay = document.getElementById("englishDisplay");
    const speakBtn = document.getElementById("speakBtn");
    const copyBtn = document.getElementById("copyBtn");
    const clearHistory = document.getElementById("clearHistory");
    const historyList = document.getElementById("historyList");
    const statusEl = document.getElementById("status");

    let history = [];
    let listening = false;
    let lastTranslation = "";

    // ── Status helper ──
    function setStatus(msg, type = "") {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    // ── Claude AI Translation ──
    async function translateWithClaude(text) {
      setStatus("Translating...", "active");
      translateBtn.classList.add("loading");
      translateBtn.disabled = true;

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            system: `You are an expert Yoruba-to-English translator with deep knowledge of Yoruba language, culture, and tone marks.
Translate the given Yoruba text into natural, fluent English.
Respond with ONLY the English translation — no explanations, no notes, no quotation marks.`,
            messages: [{ role: "user", content: text }]
          })
        });

        const data = await response.json();
        const translation = data.content?.[0]?.text?.trim() || "Translation unavailable.";

        setResult(text, translation);
        setStatus("Translation complete ✓", "active");
      } catch (err) {
        englishDisplay.textContent = "Translation failed. Please try again.";
        englishDisplay.className = "box-content placeholder";
        setStatus("Error during translation", "error");
      } finally {
        translateBtn.classList.remove("loading");
        translateBtn.disabled = false;
      }
    }

    // ── Set result to UI + history ──
    function setResult(yoruba, english) {
      yorubaDisplay.textContent = yoruba;
      yorubaDisplay.className = "box-content";

      englishDisplay.textContent = english;
      englishDisplay.className = "box-content";
      lastTranslation = english;

      addToHistory(yoruba, english);
    }

    // ── Translate button ──
    translateBtn.addEventListener("click", () => {
      const text = yorubaInput.value.trim();
      if (!text) { setStatus("Please enter Yoruba text first.", "error"); return; }
      translateWithClaude(text);
    });

    // ── Speech Recognition ──
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "yo-NG";

      recognition.onstart = () => setStatus("🎙 Listening... speak in Yorùbá", "active");
      recognition.onend = () => {
        if (listening) recognition.start(); // keep alive if still meant to listen
      };
      recognition.onerror = (e) => {
        setStatus("Mic error: " + e.error, "error");
        stopListening();
      };

      let debounceTimer;
      recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        yorubaInput.value = transcript;
        yorubaDisplay.textContent = transcript;
        yorubaDisplay.className = "box-content";

        clearTimeout(debounceTimer);
        if (event.results[event.results.length - 1].isFinal && transcript.length > 2) {
          debounceTimer = setTimeout(() => translateWithClaude(transcript), 600);
        }
      };
    } else {
      micBtn.disabled = true;
      micBtn.title = "Speech recognition not supported in this browser";
      setStatus("Mic not supported — use text input", "error");
    }

    function startListening() {
      listening = true;
      recognition.start();
      micBtn.querySelector(".btn-text").textContent = "Stop Mic";
      micBtn.querySelector("span").textContent = "⏹";
      micBtn.classList.add("listening");
    }

    function stopListening() {
      listening = false;
      recognition?.stop();
      micBtn.querySelector(".btn-text").textContent = "Start Mic";
      micBtn.querySelector("span").textContent = "🎤";
      micBtn.classList.remove("listening");
      setStatus("Mic stopped", "");
    }

    micBtn.addEventListener("click", () => {
      if (!recognition) return;
      listening ? stopListening() : startListening();
    });

    // ── Text-to-Speech ──
    speakBtn.addEventListener("click", () => {
      if (!lastTranslation) return;
      const utt = new SpeechSynthesisUtterance(lastTranslation);
      utt.lang = "en-US";
      utt.rate = 0.95;
      speechSynthesis.cancel();
      speechSynthesis.speak(utt);
      setStatus("Speaking...", "active");
      utt.onend = () => setStatus("Done", "");
    });

    // ── Copy ──
    copyBtn.addEventListener("click", () => {
      if (!lastTranslation) return;
      navigator.clipboard.writeText(lastTranslation).then(() => {
        copyBtn.textContent = "✅ Copied!";
        setTimeout(() => copyBtn.textContent = "📋 Copy", 2000);
      });
    });

    // ── History ──
    function addToHistory(yoruba, english) {
      const now = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      history.unshift({ yoruba, english, time: now });
      if (history.length > 20) history.pop();
      renderHistory();
    }

    function renderHistory() {
      if (!history.length) {
        historyList.innerHTML = '<div class="empty-state">No translations yet</div>';
        return;
      }
      historyList.innerHTML = history.map(h => `
        <div class="history-item">
          <div class="yo">🇳🇬 ${escapeHtml(h.yoruba)}</div>
          <div class="en">🇬🇧 ${escapeHtml(h.english)}</div>
          <div class="ts">${h.time}</div>
        </div>
      `).join("");
    }

    clearHistory.addEventListener("click", () => {
      history = [];
      renderHistory();
    });

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
  </script>
</body>
</html>
