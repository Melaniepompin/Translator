<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoruba Live Translator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }.container {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 100%;
  max-width: 450px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 15px;
}

#micBtn {
  background: black;
  color: white;
}

.box {
  background: #f8f8f8;
  border-radius: 10px;
  padding: 15px;
  margin-top: 12px;
  min-height: 60px;
}

.label {
  font-weight: bold;
  margin-bottom: 8px;
}

  </style>
</head>
<body>
  <div class="container">
    <h2>Yoruba → English Translator</h2><button id="micBtn">🎤 Start Listening</button>

<div class="box">
  <div class="label">Yoruba Speech:</div>
  <div id="yorubaText">Waiting...</div>
</div>

<div class="box">
  <div class="label">English Translation:</div>
  <div id="englishText">Waiting...</div>
</div>

  </div>  <script>
    const micBtn = document.getElementById("micBtn");
    const yorubaText = document.getElementById("yorubaText");
    const englishText = document.getElementById("englishText");

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Speech recognition is not supported on this browser.");
    }

    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "yo-NG";

    let listening = false;

    async function translateText(text) {
      try {
        const response = await fetch(
          `https://translate.googleapis.com/translate_a/single?client=gtx&sl=yo&tl=en&dt=t&q=${encodeURIComponent(text)}`
        );

        const data = await response.json();
        englishText.innerText = data[0][0][0];
      } catch (error) {
        englishText.innerText = "Translation error.";
      }
    }

    recognition.onresult = async (event) => {
      let transcript = "";

      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }

      yorubaText.innerText = transcript;

      if (transcript.length > 2) {
        await translateText(transcript);
      }
    };

    micBtn.onclick = () => {
      if (!listening) {
        recognition.start();
        micBtn.innerText = "⏹ Stop Listening";
        listening = true;
      } else {
        recognition.stop();
        micBtn.innerText = "🎤 Start Listening";
        listening = false;
      }
    };
  </script></body>
</html>
